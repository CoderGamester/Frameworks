name: Sync assigned items to project

# Adds every open issue and PR assigned to CoderGamester to user project 4, and
# stamps each one with a Kind of Issue or Pull request.
#
# Logs are public (this repo is public), so this workflow deliberately prints
# only counts -- never issue URLs or titles, which may come from private repos.
#
# Everything addresses the project by node ID rather than via `gh project
# --owner`. The CLI's owner flag has to resolve the login to a user or an org,
# which needs read:org on top of everything else; without it the CLI fails with
# "unknown owner type". Node IDs skip that lookup, so the token only needs
# `repo` (to see private repos in search) and `project`.

on:
  schedule:
    # Once daily at 00:17 UTC, offset off the hour to dodge scheduler congestion.
    - cron: '17 0 * * *'
  workflow_dispatch:

# Nothing here needs the default token; keep it powerless.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
      OWNER: CoderGamester
      PROJECT_ID: PVT_kwHOAF3iKs4Be1kq
      KIND_FIELD_ID: PVTSSF_lAHOAF3iKs4Be1kqzhZNKKk
      KIND_OPT_ISSUE: '936b2bd2'
      KIND_OPT_PR: da72b982
    steps:
      - name: Add assigned issues and PRs to project 4
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROJECT_SYNC_TOKEN secret is not set" >&2
            exit 1
          fi

          # Node IDs of everything open and assigned to me, anywhere the token
          # can see. addProjectV2ItemById takes these directly.
          gh search issues \
            --assignee "$OWNER" \
            --state open \
            --include-prs \
            --limit 200 \
            --json id --jq '.[].id' | sort -u > want.txt

          # What the project already tracks, so we only add the difference.
          gh api graphql --paginate -F pid="$PROJECT_ID" -f query='
            query($pid: ID!, $endCursor: String) {
              node(id: $pid) {
                ... on ProjectV2 {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes { content { ... on Issue { id } ... on PullRequest { id } } }
                  }
                }
              }
            }' --jq '.data.node.items.nodes[].content.id // empty' | sort -u > have.txt

          comm -23 want.txt have.txt > to_add.txt

          echo "assigned=$(wc -l < want.txt | tr -d ' ')" \
               "tracked=$(wc -l < have.txt | tr -d ' ')" \
               "to_add=$(wc -l < to_add.txt | tr -d ' ')"

          added=0
          failed=0
          while read -r cid; do
            [ -n "$cid" ] || continue
            if gh api graphql -F pid="$PROJECT_ID" -F cid="$cid" -f query='
              mutation($pid: ID!, $cid: ID!) {
                addProjectV2ItemById(input: {projectId: $pid, contentId: $cid}) {
                  item { id }
                }
              }' >/dev/null 2>&1; then
              added=$((added + 1))
            else
              failed=$((failed + 1))
            fi
          done < to_add.txt

          echo "added=$added failed=$failed"
          [ "$failed" -eq 0 ]

      - name: Stamp Kind on any item missing it
        run: |
          set -euo pipefail

          # Reconcile rather than set-on-add, so a failed write on an earlier
          # run gets picked up on the next one.
          gh api graphql --paginate -F pid="$PROJECT_ID" -f query='
            query($pid: ID!, $endCursor: String) {
              node(id: $pid) {
                ... on ProjectV2 {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id type
                      kind: fieldValueByName(name: "Kind") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' --jq '.data.node.items.nodes[] | select(.kind == null) | "\(.id) \(.type)"' > missing.txt

          echo "missing_kind=$(wc -l < missing.txt | tr -d ' ')"

          stamped=0
          failed=0
          while read -r iid itype; do
            [ -n "$iid" ] || continue
            case "$itype" in
              ISSUE)        opt="$KIND_OPT_ISSUE" ;;
              PULL_REQUEST) opt="$KIND_OPT_PR" ;;
              # Draft issues and redacted items have no Kind to infer.
              *)            continue ;;
            esac
            if gh api graphql -F pid="$PROJECT_ID" -F iid="$iid" \
                 -F fid="$KIND_FIELD_ID" -F opt="$opt" -f query='
              mutation($pid: ID!, $iid: ID!, $fid: ID!, $opt: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $pid, itemId: $iid, fieldId: $fid,
                  value: {singleSelectOptionId: $opt}
                }) { projectV2Item { id } }
              }' >/dev/null 2>&1; then
              stamped=$((stamped + 1))
            else
              failed=$((failed + 1))
            fi
          done < missing.txt

          echo "stamped=$stamped failed=$failed"
          [ "$failed" -eq 0 ]
